<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicWi</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MicWi">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1 class="title">Mic<span>WiFi</span></h1>
            <p class="subtitle">Transmite el audio de tu celular a la PC</p>
            
            <div class="mic-status" id="status-indicator">
                <div class="pulse-ring"></div>
                <div class="mic-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" x2="12" y1="19" y2="22"/>
                    </svg>
                </div>
            </div>

            <p class="status-text" id="status-text">Desconectado</p>
            
            <button id="connect-btn" class="btn btn-primary">Conectar Micrófono</button>
            
            <div class="volume-control" id="volume-control" style="opacity: 0; transition: opacity 0.3s ease; margin-top: 20px; width: 100%; text-align: left;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <label for="gain-slider" style="font-size: 0.9rem; color: var(--text-muted);">Volumen</label>
                    <span id="gain-value" style="font-size: 0.9rem; color: #10b981; font-weight: 600;">100%</span>
                </div>
                <input type="range" id="gain-slider" min="0" max="800" value="100" style="width: 100%; accent-color: var(--primary);">
            </div>

            <div id="volume-meter">
                <div id="volume-bar"></div>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
